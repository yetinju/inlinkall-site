<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="凌茂电子产品中心概念设计" />
    <title>产品中心｜LinkAll 凌茂电子</title>
    <style>
      :root { --ink:#071a2f; --navy:#0a2947; --blue:#1268b3; --cyan:#36c3e6; --red:#e72f36; --pale:#eef4f7; --line:#d9e4ea; --muted:#617d92; }
      * { box-sizing:border-box; }
      html { scroll-behavior:smooth; }
      body { margin:0; background:#f8fafb; color:var(--ink); font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",Arial,sans-serif; -webkit-font-smoothing:antialiased; }
      a { color:inherit; text-decoration:none; }
      button,input { font:inherit; }
      .wrap { width:min(1180px,calc(100% - 48px)); margin:auto; }
      .topline { min-height:34px; color:#bdd0dc; background:var(--ink); font-size:12px; }
      .topline .wrap { min-height:34px; display:flex; align-items:center; justify-content:space-between; gap:18px; }
      .topline strong { color:#fff; font-weight:600; }
      .topline-tel { color:#fff; text-decoration:none; }
      .topline-tel:hover { text-decoration:underline; }
      header { position:sticky; top:0; z-index:5; border-bottom:1px solid rgba(215,226,233,.9); background:rgba(250,252,253,.94); backdrop-filter:blur(14px); }
      .nav { min-height:82px; display:flex; align-items:center; justify-content:space-between; gap:25px; }
      .brand { display:flex; width:162px; flex:0 0 auto; align-items:center; }
      .brand img { display:block; height:52px; width:auto; max-width:190px; object-fit:contain; }
      .nav-links { display:flex; align-items:center; gap:clamp(16px,2.4vw,35px); color:#19384f; font-size:14px; font-weight:700; }
      .nav-links a { position:relative; padding:8px 0; }
      .nav-links a.active::after { position:absolute; right:0; bottom:0; left:0; height:2px; content:""; background:var(--red); }
      .cta { display:inline-flex; min-height:46px; align-items:center; justify-content:center; gap:12px; padding:0 20px; color:#fff; border:1px solid var(--blue); background:var(--blue); font-size:14px; font-weight:700; transition:.2s ease; }
      .cta:hover { background:#095492; transform:translateY(-1px); }
      .hero { overflow:hidden; position:relative; color:white; background:var(--ink); }
      .hero::after { position:absolute; top:-310px; right:-130px; width:720px; height:720px; content:""; border:1px solid rgba(61,203,236,.31); border-radius:50%; box-shadow:0 0 0 75px rgba(61,203,236,.035),0 0 0 150px rgba(61,203,236,.025); }
      .hero .wrap { position:relative; z-index:1; min-height:335px; display:flex; flex-direction:column; align-items:flex-start; justify-content:center; padding:62px 0; }
      .crumb { color:#98b3c3; font-size:12px; }
      .eyebrow { display:inline-flex; align-items:center; gap:9px; margin-top:31px; color:#73d9ee; font:700 11px/1 Arial,sans-serif; letter-spacing:.16em; }
      .eyebrow::before { width:27px; height:1px; content:""; background:currentColor; }
      h1 { margin:14px 0 0; font-size:clamp(39px,5vw,64px); line-height:1.05; letter-spacing:-.07em; }
      .hero p { max-width:578px; margin:18px 0 0; color:#b8cddb; font-size:15px; line-height:1.8; }
      .catalog { padding:71px 0 108px; }
      .catalog-top { display:flex; align-items:end; justify-content:space-between; gap:28px; margin-bottom:32px; }
      .catalog-top h2 { margin:0; font-size:28px; letter-spacing:-.05em; }
      .catalog-top p { max-width:360px; margin:0; color:var(--muted); font-size:13px; line-height:1.75; }
      .tools { display:grid; grid-template-columns:265px 1fr; gap:15px; padding:17px; border:1px solid var(--line); background:#fff; box-shadow:0 9px 25px rgba(10,41,71,.035); }
      .search { position:relative; }
      .search input { width:100%; height:48px; padding:0 45px 0 15px; outline:0; color:var(--ink); border:1px solid var(--line); background:#fbfcfd; }
      .search span { position:absolute; top:13px; right:14px; color:#7892a3; font-size:21px; }
      .filters { display:flex; flex-wrap:wrap; gap:8px; }
      .filters button { min-height:48px; padding:0 15px; cursor:pointer; color:#537087; border:1px solid var(--line); background:#fff; font-size:13px; font-weight:700; transition:.18s ease; }
      .filters button:hover,.filters button.active { color:#fff; border-color:var(--navy); background:var(--navy); }
      .catalog-meta { display:flex; justify-content:space-between; gap:20px; margin:25px 0 14px; color:#6c8799; font-size:13px; }
      .catalog-meta strong { color:var(--ink); }
      .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:15px; }
      .card { min-height:245px; display:flex; flex-direction:column; padding:23px; border:1px solid var(--line); background:#fff; transition:.22s ease; }
      .card:hover { border-color:#a8c8d8; box-shadow:0 15px 31px rgba(10,41,71,.1); transform:translateY(-3px); }
      .card[hidden] { display:none; }
      .card-top { display:flex; align-items:start; justify-content:space-between; gap:15px; }
      .tag { color:#1771b9; font:700 10px/1.2 Arial,sans-serif; letter-spacing:.12em; }
      .round { display:grid; width:30px; height:30px; flex:0 0 auto; place-items:center; color:#32637c; border:1px solid #bfd0da; border-radius:50%; font-size:15px; }
      .card h3 { max-width:280px; margin:33px 0 10px; font-size:20px; line-height:1.22; letter-spacing:-.045em; }
      .card p { min-height:39px; margin:0; color:var(--muted); font-size:12px; line-height:1.7; }
      .card-foot { display:flex; justify-content:space-between; align-items:end; margin-top:auto; padding-top:20px; color:#668294; font:11px/1.3 Arial,sans-serif; letter-spacing:.04em; }
      .request { display:flex; align-items:center; justify-content:space-between; gap:30px; margin-top:52px; padding:31px 35px; color:#fff; background:var(--navy); }
      .request b { display:block; margin-bottom:7px; font-size:23px; letter-spacing:-.05em; }
      .request p { margin:0; color:#bad0dc; font-size:13px; line-height:1.65; }
      .request .cta { flex:0 0 auto; background:var(--red); border-color:var(--red); }
      .request .cta:hover { background:#c5232b; }
      .empty { grid-column:1/-1; padding:43px; color:#6c8799; text-align:center; border:1px dashed #b7cbd6; background:#fff; }
      footer { padding:46px 0 23px; color:#a3b8c7; background:#061526; }
      .footer-top { display:grid; grid-template-columns:1.75fr repeat(3,1fr); gap:25px; padding-bottom:41px; }
      .footer-logo { display:inline-flex; align-items:center; padding:11px 15px; background:#fff; border-radius:12px; }
      .footer-logo img { display:block; height:40px; width:auto; max-width:160px; object-fit:contain; }
      .footer-brand p { max-width:240px; margin:16px 0 0; font-size:12px; line-height:1.7; }
      .footer-group b { display:block; margin-bottom:14px; color:#fff; font-size:13px; }
      .footer-group a { display:block; margin:8px 0; font-size:12px; }
      .footer-bottom { display:flex; justify-content:space-between; gap:18px; padding-top:20px; border-top:1px solid rgba(169,199,216,.15); font-size:11px; }
      .consult { position:fixed; right:0; bottom:0; z-index:60; width:196px; font-family:inherit; }
      .consult-head { display:flex; align-items:center; justify-content:center; gap:8px; height:46px; color:#fff; background:var(--blue); font-size:15px; font-weight:700; cursor:pointer; user-select:none; box-shadow:0 6px 20px rgba(8,31,52,.2); }
      .consult-head svg { width:19px; height:19px; flex:0 0 auto; }
      .consult-caret { font-size:11px; transition:transform .2s ease; }
      .consult.collapsed .consult-caret { transform:rotate(180deg); }
      .consult-body { background:#fff; border:1px solid #cfe0ea; border-top:0; box-shadow:-8px 12px 28px rgba(8,31,52,.14); }
      .consult.collapsed .consult-body { display:none; }
      .consult-item { display:block; padding:12px 14px; color:#17364d; text-align:center; font-size:13px; border-top:1px solid #e7eff4; transition:background .18s ease,color .18s ease; }
      .consult-item:first-child { border-top:0; }
      .consult-item:hover { color:#fff; background:var(--blue); }
      @media (max-width:680px) { .consult { width:158px; } .consult-head { height:42px; font-size:13px; } .consult-item { padding:11px 12px; font-size:12px; } }
      @media (max-width:880px) { .nav-links{display:none}.grid{grid-template-columns:repeat(2,1fr)}.tools{grid-template-columns:1fr}.filters button{min-height:41px}.catalog-top{display:block}.catalog-top p{margin-top:13px}.footer-top{grid-template-columns:1fr 1fr}.footer-brand{grid-column:span 2} }
      @media (max-width:580px) { .wrap{width:min(100% - 32px,1180px)}.topline .side{display:none}.nav{min-height:66px}.brand{width:132px}.brand img{height:40px}.nav .cta{min-height:38px;padding:0 13px;font-size:12px}.hero .wrap{min-height:274px;padding:46px 0}.eyebrow{margin-top:25px}.grid{grid-template-columns:1fr}.catalog{padding:53px 0 72px}.request{display:block;padding:26px}.request .cta{margin-top:20px}.footer-top{grid-template-columns:1fr}.footer-brand{grid-column:auto}.footer-bottom{display:block;line-height:1.8} }
    </style>
  </head>
  <body>
    <div id="app"><div class="wrap" style="padding:120px 0;color:#658097">正在从 Directus 加载内容…</div></div>

    <script>
      const API = "https://directus-production-18ce.up.railway.app";
      const q = (c, f = "*", sort) =>
        `${API}/items/${c}?fields=${encodeURIComponent(f)}` + (sort ? `&sort=${sort}` : "");
      const esc = (s) => (s == null ? "" : String(s)
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"));
      const br = (s) => esc(s).replace(/\n/g, "<br />");
      const asset = (id) => id ? `${API}/assets/${id}` : null;
      const phoneTel = (site) => {
        const first = String((site && site.contact_phone_display) || "").split("/")[0];
        const digits = first.replace(/[^\d+]/g, "");
        return "tel:" + digits;
      };

      async function get(c, f, sort) {
        const r = await fetch(q(c, f, sort));
        if (!r.ok) throw new Error(`${c} ${r.status}`);
        const d = await r.json();
        return d.data;
      }

      function chrome(site, nav, toplineTagline, groups) {
        const cur = location.pathname.split("/").pop() || "index.html";
        const isHome = (cur === "homepage-render.html" || cur === "index.html");
        const baseOf = (href) => String(href).split("#")[0].split("/").pop();
        const navHtml = nav.map(a => {
          const b = baseOf(a.href);
          const active = b && !String(a.href).includes("#") && (b === cur || (b === "homepage-render.html" && isHome));
          return `<a href="${esc(a.href)}" class="${active ? "active" : ""}">${esc(a.label)}</a>`;
        }).join("");
        const logoImg = site.logo ? `<img src="${asset(site.logo)}" alt="${esc(site.company_name)}" />` : `<b style="font-size:22px;color:var(--blue)">LinkAll</b>`;
        const telHref = `${phoneTel(site)}`;
        const topline = `<div class="topline"><div class="wrap"><span>${esc(site.company_name)} <strong>${esc(toplineTagline)}</strong></span><span class="side">咨询电话：<a class="topline-tel" href="${telHref}">${esc(site.contact_phone_display)}</a></span></div></div>`;
        const header = `<header><nav class="nav wrap" aria-label="主导航"><a class="brand" href="homepage-render.html" aria-label="${esc(site.company_name)}首页">${logoImg}</a><div class="nav-links">${navHtml}</div><a class="cta" href="${telHref}">${esc(site.contact_phone_display ? "致电技术咨询" : "联系我们")} <span>↗</span></a></nav></header>`;
        const footerGroupsHtml = (groups || []).map(g =>
          `<div class="footer-group"><b>${esc(g.title)}</b>${(g.links || []).map(l =>
            `<a href="${esc(l.href)}">${esc(l.label)}</a>`).join("")}</div>`).join("");
        const footer = `<footer id="about"><div class="wrap"><div class="footer-top"><div class="footer-brand"><span class="footer-logo">${logoImg}</span><p>${br(site.footer_brand_text)}</p></div>${footerGroupsHtml}</div><div class="footer-bottom"><span>${esc(site.footer_copyright)}</span><span>${esc(site.footer_address)}</span></div></div></footer>`;
        return { topline, header, footer };
      }

      // 在线咨询浮动组件
      function consultWidget(site) {
        const tel = phoneTel(site);
        const items = ["销售咨询", "售后咨询", "技术咨询"];
        const head = '<div class="consult-head" role="button" tabindex="0" aria-expanded="true">'
          + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.8 14v-2a7.2 7.2 0 0 1 14.4 0v2"/><rect x="3" y="13" width="3.6" height="6.4" rx="1.6"/><rect x="17.4" y="13" width="3.6" height="6.4" rx="1.6"/><path d="M19 19.4a3.4 3.4 0 0 1-3.4 2.6h-2.2"/></svg>'
          + '<span>在线咨询</span><span class="consult-caret">▾</span></div>';
        const body = '<div class="consult-body">'
          + items.map(t => '<a class="consult-item" href="' + tel + '">' + t + '</a>').join("")
          + '</div>';
        return '<aside class="consult" id="consult">' + head + body + '</aside>';
      }
      function bindConsult() {
        const box = document.getElementById("consult");
        if (!box) return;
        const head = box.querySelector(".consult-head");
        const toggle = () => {
          const collapsed = box.classList.toggle("collapsed");
          head.setAttribute("aria-expanded", String(!collapsed));
        };
        head.addEventListener("click", toggle);
        head.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); } });
      }

      async function main() {
        const [site, nav, groups, pp, filters, items] = await Promise.all([
          get("public_settings"), get("public_nav", "*", "sort"),
          get("public_footer_groups", "id,title,sort,links.*", "sort"), get("product_page"),
          get("product_filters", "*", "sort"), get("product_items", "*", "sort"),
        ]);

        document.title = site.site_title || "LinkAll 凌茂电子";
        const _m = document.querySelector('meta[name="description"]');
        if (_m) _m.setAttribute("content", site.meta_description || "");

        const { topline, header, footer } = chrome(site, nav, pp.topline_tagline, groups);

        const filterHtml = filters.map((f, i) =>
          `<button class="${i === 0 ? "active" : ""}" data-filter="${esc(f.value)}">${esc(f.label)}</button>`).join("");

        const cardHtml = items.map(it =>
          `<article class="card" data-category="${esc(it.category)}" data-search="${esc(it.search_kw)}"><div class="card-top"><span class="tag">${esc(it.tag)}</span><span class="round">↗</span></div><h3>${esc(it.title)}</h3><p>${esc(it.desc)}</p><div class="card-foot"><span>${esc(it.foot_label)}</span><a href="${esc(it.link_href)}">${esc(it.link_label)}</a></div></article>`).join("");

        document.getElementById("app").innerHTML = `
          ${topline}
          ${header}
          <main>
            <section class="hero"><div class="wrap"><span class="crumb">${esc(pp.hero_crumb)}</span><span class="eyebrow">${esc(pp.hero_eyebrow)}</span><h1>${esc(pp.hero_title_1)}<br />${esc(pp.hero_title_2)}</h1><p>${esc(pp.hero_subtitle)}</p></div></section>
            <section class="catalog"><div class="wrap">
              <div class="catalog-top"><h2>${esc(pp.catalog_title)}</h2><p>${esc(pp.catalog_subtitle)}</p></div>
              <div class="tools"><label class="search"><input id="search" type="search" placeholder="搜索产品名称、型号或关键字" autocomplete="off" /><span>⌕</span></label><div class="filters" id="filters">${filterHtml}</div></div>
              <div class="catalog-meta"><span>当前显示 <strong id="count">${items.length}</strong> 项</span><span>找不到所需产品？<a href="${esc(pp.meta_link_href)}"><strong>${esc(pp.meta_link_text)}</strong></a></span></div>
              <div class="grid" id="grid">${cardHtml}<p class="empty" id="empty" hidden>没有匹配的产品。请更换关键字，或直接提交您的测试需求。</p></div>
              <aside class="request"><div><b>${esc(pp.request_title)}</b><p>${esc(pp.request_desc)}</p></div><a class="cta" href="${esc(pp.request_cta_href)}">${esc(pp.request_cta_label)} <span>↗</span></a></aside>
            </div></section>
          </main>
          ${footer}
          ${consultWidget(site)}
        `;
        bindConsult();

        // 搜索 + 筛选交互
        const fButtons = [...document.querySelectorAll('[data-filter]')];
        const cards = [...document.querySelectorAll('.card')];
        const search = document.querySelector('#search');
        const count = document.querySelector('#count');
        const empty = document.querySelector('#empty');
        let active = 'all';
        function filterCards() {
          const term = (search.value || "").trim().toLowerCase();
          const shown = cards.filter(card => {
            const catMatch = active === 'all' || card.dataset.category === active;
            const searchMatch = !term || `${card.innerText} ${card.dataset.search}`.toLowerCase().includes(term);
            card.hidden = !(catMatch && searchMatch);
            return catMatch && searchMatch;
          });
          count.textContent = shown.length;
          empty.hidden = shown.length !== 0;
        }
        fButtons.forEach(btn => btn.addEventListener('click', () => {
          active = btn.dataset.filter;
          fButtons.forEach(item => item.classList.toggle('active', item === btn));
          filterCards();
        }));
        search.addEventListener('input', filterCards);
      }
      main().catch(e => {
        document.getElementById("app").innerHTML =
          `<div class="wrap" style="padding:120px 0;color:#e72f36">加载失败：${esc(e.message)}<br/>请确认 Directus 实例可访问且已开启 Public 只读权限。</div>`;
        console.error(e);
      });
    </script>
  </body>
</html>
