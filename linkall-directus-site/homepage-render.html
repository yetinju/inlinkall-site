<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LinkAll 凌茂电子｜首页</title>
    <style>
      :root {
        --ink: #071a2f;
        --navy: #0a2947;
        --blue: #1268b3;
        --signal: #36c3e6;
        --red: #e72f36;
        --mist: #eef4f7;
        --paper: #f9fbfc;
        --line: #d7e2e9;
        --muted: #658097;
        --shadow: 0 18px 46px rgba(8, 31, 52, .11);
      }

      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body {
        margin: 0;
        color: var(--ink);
        background: var(--paper);
        font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      a { color: inherit; text-decoration: none; }
      button { font: inherit; }
      .wrap { width: min(1180px, calc(100% - 48px)); margin: auto; }
      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        color: var(--signal);
        font: 700 12px/1 "Arial", sans-serif;
        letter-spacing: .15em;
        text-transform: uppercase;
      }
      .eyebrow::before { content: ""; width: 28px; height: 1px; background: currentColor; }
      .section-head { display: flex; justify-content: space-between; align-items: end; gap: 24px; margin-bottom: 34px; }
      .section-head h2 { max-width: 650px; margin: 13px 0 0; font-size: clamp(29px, 4vw, 46px); line-height: 1.18; letter-spacing: -.045em; }
      .section-head p { max-width: 330px; margin: 0; color: var(--muted); font-size: 14px; line-height: 1.85; }
      .tiny-arrow { display: inline-grid; width: 30px; height: 30px; place-items: center; border: 1px solid currentColor; border-radius: 50%; font-size: 17px; }

      .topline { background: var(--ink); color: #b8c8d4; font-size: 12px; }
      .topline .wrap { min-height: 34px; display: flex; justify-content: space-between; align-items: center; gap: 18px; }
      .topline .right { display: flex; gap: 19px; }
      .topline strong { color: white; font-weight: 600; }
      .topline-tel { color: #fff; text-decoration: none; }
      .topline-tel:hover { text-decoration: underline; }

      header { position: sticky; top: 0; z-index: 5; background: rgba(249, 251, 252, .93); border-bottom: 1px solid rgba(215, 226, 233, .9); backdrop-filter: blur(14px); }
      .nav { height: 82px; display: flex; align-items: center; justify-content: space-between; gap: 24px; }
      .brand { display: flex; flex: 0 0 auto; align-items: center; }
      .brand img { display: block; height: 52px; width: auto; max-width: 190px; object-fit: contain; }
      .nav-links { display: flex; align-items: center; gap: clamp(16px, 2.3vw, 34px); font-size: 14px; font-weight: 600; }
      .nav-links a { position: relative; padding: 7px 0; }
      .nav-links a:first-child::after { position: absolute; right: 0; bottom: 0; left: 0; height: 2px; content: ""; background: var(--red); }
      .nav-links a.active::after { position: absolute; right: 0; bottom: 0; left: 0; height: 2px; content: ""; background: var(--red); }
      .cta { display: inline-flex; align-items: center; justify-content: center; gap: 12px; min-height: 46px; padding: 0 20px; color: white; background: var(--blue); border: 1px solid var(--blue); font-size: 14px; font-weight: 700; transition: .2s ease; }
      .cta:hover { background: #095492; transform: translateY(-1px); }

      .hero { position: relative; overflow: hidden; min-height: 664px; color: white; background: var(--ink); }
      .hero::before { position: absolute; inset: 0; content: ""; background-image: linear-gradient(rgba(95, 194, 220, .10) 1px, transparent 1px), linear-gradient(90deg, rgba(95, 194, 220, .10) 1px, transparent 1px); background-size: 72px 72px; mask-image: linear-gradient(90deg, #000 0%, #000 58%, transparent 94%); }
      .hero::after { position: absolute; top: -230px; right: -110px; width: 710px; height: 710px; content: ""; border: 1px solid rgba(58, 199, 233, .3); border-radius: 50%; box-shadow: 0 0 0 70px rgba(58, 199, 233, .035), 0 0 0 140px rgba(58, 199, 233, .025); }
      .hero .wrap { position: relative; z-index: 1; min-height: 664px; display: grid; grid-template-columns: minmax(0, .94fr) minmax(420px, 1.06fr); align-items: center; gap: 30px; }
      .hero-copy { padding: 82px 0 68px; }
      .hero .eyebrow { color: #70d5eb; }
      h1 { max-width: 630px; margin: 23px 0 22px; font-size: clamp(52px, 6vw, 82px); line-height: .99; letter-spacing: -.075em; }
      h1 em { color: var(--signal); font-style: normal; }
      .hero-copy > p { max-width: 500px; margin: 0; color: #c0d2e0; font-size: 17px; line-height: 1.8; }
      .hero-actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 37px; }
      .hero .cta { min-width: 151px; }
      .ghost { display: inline-flex; align-items: center; justify-content: center; min-height: 46px; padding: 0 18px; border: 1px solid rgba(209, 233, 242, .5); color: white; font-size: 14px; font-weight: 700; }
      .ghost:hover { border-color: var(--signal); color: var(--signal); }
      .hero-meta { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; max-width: 450px; padding-top: 60px; }
      .hero-meta div { padding-left: 13px; border-left: 1px solid rgba(112, 213, 235, .55); }
      .hero-meta b { display: block; margin-bottom: 5px; color: #fff; font: 700 19px/1.1 Arial, sans-serif; }
      .hero-meta span { display: block; color: #9cb4c6; font-size: 12px; line-height: 1.4; }

      .signal-stage { position: relative; height: 482px; }
      .stage-label { position: absolute; top: 42px; left: 10px; z-index: 2; color: #8ca9bd; font: 11px/1 Arial, sans-serif; letter-spacing: .15em; }
      .stage-label::before { display: inline-block; width: 8px; height: 8px; margin-right: 8px; content: ""; background: var(--red); border-radius: 50%; box-shadow: 0 0 13px var(--red); }
      .orbit { position: absolute; top: 50%; left: 50%; width: 397px; height: 397px; border: 1px solid rgba(80, 207, 237, .35); border-radius: 50%; transform: translate(-49%, -47%); }
      .orbit::before, .orbit::after { position: absolute; content: ""; border: 1px solid rgba(80, 207, 237, .17); border-radius: 50%; }
      .orbit::before { inset: 40px; }
      .orbit::after { inset: 90px; border-color: rgba(80, 207, 237, .1); }
      .beam { position: absolute; top: 222px; left: 5px; width: 448px; height: 1px; background: linear-gradient(90deg, transparent, var(--signal), transparent); transform: rotate(-28deg); box-shadow: 0 0 19px var(--signal); }
      .machine { position: absolute; top: 121px; right: 55px; width: 315px; height: 290px; overflow: hidden; background: linear-gradient(135deg, #294a60, #102d43 59%, #0c2337); border: 1px solid rgba(139, 214, 235, .7); box-shadow: -25px 30px 60px rgba(0, 0, 0, .35), inset 0 0 80px rgba(25, 142, 179, .14); transform: skewY(-6deg); }
      .machine::before { position: absolute; top: 28px; left: 27px; width: 136px; height: 95px; content: ""; border: 1px solid #6fd9f0; background: repeating-linear-gradient(0deg, transparent 0 16px, rgba(111, 217, 240, .22) 17px 18px), repeating-linear-gradient(90deg, transparent 0 23px, rgba(111, 217, 240, .13) 24px 25px); box-shadow: 0 0 21px rgba(111, 217, 240, .2); }
      .machine::after { position: absolute; right: -18px; bottom: 30px; width: 243px; height: 70px; content: ""; border-top: 1px solid rgba(126, 214, 239, .42); border-bottom: 1px solid rgba(126, 214, 239, .24); background: repeating-linear-gradient(90deg, rgba(103, 215, 237, .16) 0 1px, transparent 1px 18px); }
      .machine-name { position: absolute; right: 25px; bottom: 133px; color: #d7f7ff; font: 700 14px/1.2 Arial, sans-serif; letter-spacing: .1em; transform: skewY(6deg); }
      .machine-status { position: absolute; top: 169px; left: 30px; width: 145px; color: #6edbf4; font: 10px/1.7 monospace; transform: skewY(6deg); }
      .node { position: absolute; z-index: 3; width: 108px; padding: 13px 14px; background: rgba(15, 46, 67, .84); border: 1px solid rgba(124, 219, 242, .38); box-shadow: 0 10px 28px rgba(0, 0, 0, .22); backdrop-filter: blur(9px); }
      .node b { display: block; color: white; font-size: 12px; }
      .node span { display: block; margin-top: 5px; color: #9fc2d2; font: 10px/1.25 Arial, sans-serif; }
      .node.one { right: 5px; bottom: 58px; }
      .node.two { left: 14px; bottom: 52px; }
      .stage-mark { position: absolute; right: 12px; top: 72px; color: var(--signal); font: 700 11px/1 Arial, sans-serif; letter-spacing: .13em; writing-mode: vertical-rl; }

      .focus { padding: 92px 0; background: #fff; }
      .focus-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
      .focus-card { position: relative; min-height: 318px; padding: 27px; overflow: hidden; color: #19384f; border: 1px solid var(--line); background: #f8fbfc; transition: .25s ease; }
      .focus-card::after { position: absolute; right: -55px; bottom: -56px; width: 188px; height: 188px; content: ""; border: 1px solid #c5e9f1; border-radius: 50%; box-shadow: 0 0 0 35px rgba(54, 195, 230, .05); }
      .focus-card:hover { color: #fff; border-color: var(--navy); background: var(--navy); box-shadow: var(--shadow); transform: translateY(-5px); }
      .focus-card:hover p { color: #b9cfdb; }
      .focus-card:hover::after { border-color: rgba(112, 213, 235, .7); }
      .focus-card b { position: relative; z-index: 1; color: var(--blue); font: 700 11px/1 Arial, sans-serif; letter-spacing: .14em; }
      .focus-card h3 { position: relative; z-index: 1; max-width: 270px; margin: 40px 0 11px; font-size: 27px; line-height: 1.15; letter-spacing: -.06em; }
      .focus-card p { position: relative; z-index: 1; max-width: 290px; margin: 0; color: var(--muted); font-size: 13px; line-height: 1.75; }
      .focus-card span { position: absolute; z-index: 1; right: 27px; bottom: 25px; color: inherit; }

      section { padding: 112px 0; }
      .solutions { background: var(--mist); }
      .solution-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 1px; background: #cddde5; border: 1px solid #cddde5; }
      .solution-card { min-height: 265px; display: flex; flex-direction: column; justify-content: space-between; padding: 23px 20px; background: #f7fafb; transition: .25s ease; }
      .solution-card:hover { color: white; background: var(--navy); transform: translateY(-7px); box-shadow: var(--shadow); }
      .solution-card:hover p { color: #b7cad8; }
      .solution-icon { display: grid; width: 42px; height: 42px; place-items: center; color: var(--blue); border: 1px solid currentColor; border-radius: 50%; font: 700 14px/1 Arial, sans-serif; }
      .solution-card h3 { margin: 37px 0 9px; font-size: 18px; letter-spacing: -.04em; }
      .solution-card p { min-height: 51px; margin: 0; color: var(--muted); font-size: 12px; line-height: 1.65; }
      .solution-card .tiny-arrow { align-self: end; margin-top: 15px; font-size: 15px; }

      .applications { background: white; }
      .application-layout { display: grid; grid-template-columns: 1fr 1.45fr; gap: 68px; }
      .application-copy p { max-width: 360px; margin: 19px 0 29px; color: var(--muted); font-size: 15px; line-height: 1.9; }
      .link-line { display: inline-flex; align-items: center; gap: 12px; color: var(--blue); font-size: 14px; font-weight: 700; }
      .application-list { border-top: 1px solid var(--line); }
      .application-item { display: grid; grid-template-columns: 46px 1fr auto; gap: 15px; align-items: center; min-height: 79px; border-bottom: 1px solid var(--line); }
      .application-item b { color: #9ab1c0; font: 700 12px/1 Arial, sans-serif; }
      .application-item span { font-size: 18px; font-weight: 700; letter-spacing: -.03em; }
      .application-item small { color: var(--muted); font-size: 12px; }

      .cases { background: #f1f6f8; }
      .case-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 18px; }
      .case-card { position: relative; min-height: 390px; display: flex; overflow: hidden; flex-direction: column; justify-content: space-between; padding: 28px; color: white; background: var(--navy); box-shadow: 0 14px 35px rgba(8, 31, 52, .09); }
      .case-card.photo { background: linear-gradient(180deg, rgba(5, 23, 39, .13), rgba(5, 23, 39, .92)), var(--photo, #0a2947) center/cover; }
      .case-card.data { background: linear-gradient(145deg, #145986, #092c49 68%, #071f35); }
      .case-card.data::before { position: absolute; inset: 0; content: ""; background: repeating-linear-gradient(90deg, transparent 0 52px, rgba(98, 215, 238, .12) 53px 54px), repeating-linear-gradient(0deg, transparent 0 52px, rgba(98, 215, 238, .1) 53px 54px); mask-image: linear-gradient(135deg, transparent 10%, #000 100%); }
      .case-card.data::after { position: absolute; top: 115px; right: -25px; width: 76%; height: 2px; content: ""; background: linear-gradient(90deg, transparent, #72dcec 12%, #72dcec 88%, transparent); box-shadow: 0 0 18px rgba(114, 220, 236, .8); transform: rotate(-11deg); }
      .case-card > * { position: relative; z-index: 1; }
      .case-kicker { color: #77d9ed; font: 700 11px/1 Arial, sans-serif; letter-spacing: .14em; }
      .case-copy h3 { max-width: 430px; margin: 0 0 11px; font-size: 28px; line-height: 1.16; letter-spacing: -.055em; }
      .case-copy p { max-width: 465px; margin: 0; color: #c3d7e1; font-size: 13px; line-height: 1.75; }
      .case-result { display: flex; align-items: end; justify-content: space-between; gap: 18px; margin-top: 27px; padding-top: 17px; border-top: 1px solid rgba(189, 226, 237, .38); color: #c6dfe8; font-size: 11px; }
      .case-result b { color: white; font: 700 24px/1 Arial, sans-serif; }

      .support { background: white; }
      .support-cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
      .support-card { padding: 2px 0 8px; }
      .support-card b { display: block; margin-bottom: 16px; color: var(--red); font: 700 13px/1 Arial, sans-serif; letter-spacing: .11em; }
      .support-card h3 { margin: 0 0 10px; font-size: 20px; letter-spacing: -.04em; }
      .support-card p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.75; }

      .contact { position: relative; overflow: hidden; padding: 87px 0; color: white; background: var(--ink); }
      .contact::after { position: absolute; top: -105px; right: 10%; width: 345px; height: 345px; content: ""; border: 1px solid rgba(75, 205, 235, .34); border-radius: 50%; box-shadow: 0 0 0 56px rgba(75, 205, 235, .045); }
      .contact .wrap { position: relative; z-index: 1; display: flex; justify-content: space-between; align-items: center; gap: 28px; }
      .contact h2 { max-width: 630px; margin: 16px 0 0; font-size: clamp(31px, 4vw, 50px); line-height: 1.15; letter-spacing: -.06em; }
      .contact .cta { flex: 0 0 auto; min-width: 168px; background: var(--red); border-color: var(--red); }
      .contact .cta:hover { background: #c8222a; }

      footer { padding: 46px 0 23px; color: #a3b8c7; background: #061526; }
      .footer-top { display: grid; grid-template-columns: 1.75fr repeat(3, 1fr); gap: 25px; padding-bottom: 41px; }
      .footer-logo { display: inline-flex; align-items: center; padding: 11px 15px; background: #fff; border-radius: 12px; }
      .footer-logo img { display: block; height: 40px; width: auto; max-width: 160px; object-fit: contain; }
      .footer-brand p { max-width: 240px; margin: 16px 0 0; font-size: 12px; line-height: 1.7; }
      .footer-group b { display: block; margin-bottom: 14px; color: white; font-size: 13px; }
      .footer-group a { display: block; margin: 8px 0; font-size: 12px; }
      .footer-bottom { display: flex; justify-content: space-between; gap: 18px; padding-top: 20px; border-top: 1px solid rgba(169, 199, 216, .15); font-size: 11px; }

      /* 在线咨询浮动组件 */
      .consult { position: fixed; right: 0; bottom: 0; z-index: 60; width: 196px; font-family: inherit; }
      .consult-head { display: flex; align-items: center; justify-content: center; gap: 8px; height: 46px; color: #fff; background: var(--blue); font-size: 15px; font-weight: 700; cursor: pointer; user-select: none; box-shadow: 0 6px 20px rgba(8, 31, 52, .2); }
      .consult-head svg { width: 19px; height: 19px; flex: 0 0 auto; }
      .consult-caret { font-size: 11px; transition: transform .2s ease; }
      .consult.collapsed .consult-caret { transform: rotate(180deg); }
      .consult-body { background: #fff; border: 1px solid #cfe0ea; border-top: 0; box-shadow: -8px 12px 28px rgba(8, 31, 52, .14); }
      .consult.collapsed .consult-body { display: none; }
      .consult-item { display: block; padding: 12px 14px; color: #17364d; text-align: center; font-size: 13px; border-top: 1px solid #e7eff4; transition: background .18s ease, color .18s ease; }
      .consult-item:first-child { border-top: 0; }
      .consult-item:hover { color: #fff; background: var(--blue); }
      @media (max-width: 680px) { .consult { width: 158px; } .consult-head { height: 42px; font-size: 13px; } .consult-item { padding: 11px 12px; font-size: 12px; } }

      @media (max-width: 980px) {
        .nav-links { display: none; }
        .hero .wrap { grid-template-columns: 1fr; }
        .hero-copy { padding-bottom: 20px; }
        .signal-stage { height: 380px; margin-top: -30px; }
        .focus-grid, .solution-grid { grid-template-columns: repeat(3, 1fr); }
        .application-layout { grid-template-columns: 1fr; gap: 35px; }
        .case-grid { grid-template-columns: 1fr; }
        .support-cards { grid-template-columns: repeat(2, 1fr); row-gap: 33px; }
      }
      @media (max-width: 680px) {
        .wrap { width: min(100% - 32px, 1180px); }
        .topline .right { display: none; }
        .topline .wrap { justify-content: center; }
        .nav { height: 66px; }
        .brand img { height: 40px; }
        .nav .cta { min-height: 38px; padding: 0 13px; font-size: 12px; }
        .hero { min-height: auto; }
        .hero .wrap { min-height: auto; }
        .hero-copy { padding: 65px 0 16px; }
        h1 { font-size: 54px; }
        .hero-copy > p { font-size: 15px; }
        .hero-meta { padding-top: 40px; }
        .signal-stage { height: 300px; transform: scale(.81); transform-origin: left top; margin-bottom: -57px; }
        section { padding: 73px 0; }
        .section-head { display: block; }
        .section-head p { margin-top: 17px; }
        .focus { padding: 67px 0; }
        .solution-grid { grid-template-columns: repeat(2, 1fr); }
        .focus-grid { grid-template-columns: 1fr; }
        .focus-card { min-height: 270px; padding: 20px; }
        .focus-card h3 { margin-top: 33px; font-size: 23px; }
        .solution-card { min-height: 230px; padding: 18px; }
        .application-item { grid-template-columns: 38px 1fr; }
        .application-item small { grid-column: 2; margin-top: -19px; }
        .case-card { min-height: 345px; padding: 23px; }
        .support-cards { grid-template-columns: 1fr; }
        .contact .wrap { align-items: flex-start; flex-direction: column; }
        .footer-top { grid-template-columns: 1fr 1fr; }
        .footer-brand { grid-column: span 2; }
        .footer-bottom { display: block; line-height: 1.8; }
      }
    </style>
  </head>
  <body>
    <div id="app"><div class="wrap" style="padding:120px 0;color:#658097">正在从 Directus 加载内容…</div></div>

    <script>
      const API = "https://directus-production-18ce.up.railway.app";
      const q = (c, f = "*", sort) =>
        `${API}/items/${c}?fields=${encodeURIComponent(f)}` + (sort ? `&sort=${sort}` : "");
      const esc = (s) => (s == null ? "" : String(s)
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"));
      const br = (s) => esc(s).replace(/\n/g, "<br />");
      const asset = (id) => id ? `${API}/assets/${id}` : null;
      const phoneTel = (site) => {
        const first = String((site && site.contact_phone_display) || "").split("/")[0];
        const digits = first.replace(/[^\d+]/g, "");
        return "tel:" + digits;
      };

      async function get(c, f, sort) {
        const r = await fetch(q(c, f, sort));
        const d = await r.json();
        return d.data;
      }

      // 在线咨询浮动组件
      function consultWidget(site) {
        const tel = phoneTel(site);
        const items = ["销售咨询", "售后咨询", "技术咨询"];
        const head = '<div class="consult-head" role="button" tabindex="0" aria-expanded="true">'
          + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.8 14v-2a7.2 7.2 0 0 1 14.4 0v2"/><rect x="3" y="13" width="3.6" height="6.4" rx="1.6"/><rect x="17.4" y="13" width="3.6" height="6.4" rx="1.6"/><path d="M19 19.4a3.4 3.4 0 0 1-3.4 2.6h-2.2"/></svg>'
          + '<span>在线咨询</span><span class="consult-caret">▾</span></div>';
        const body = '<div class="consult-body">'
          + items.map(t => '<a class="consult-item" href="' + tel + '">' + t + '</a>').join("")
          + '</div>';
        return '<aside class="consult" id="consult">' + head + body + '</aside>';
      }
      function bindConsult() {
        const box = document.getElementById("consult");
        if (!box) return;
        const head = box.querySelector(".consult-head");
        const toggle = () => {
          const collapsed = box.classList.toggle("collapsed");
          head.setAttribute("aria-expanded", String(!collapsed));
        };
        head.addEventListener("click", toggle);
        head.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); } });
      }

      async function main() {
        const [site, hero, heroMeta, focus, heads, solutions, apps, cases, support, contact, nav, groups] =
          await Promise.all([
            get("public_settings"), get("home_hero"), get("home_hero_meta", "*", "sort"),
            get("home_focus_cards", "*", "sort"), get("home_section_headings"),
            get("home_solution_cards", "*", "sort"), get("home_application_items", "*", "sort"),
            get("home_case_studies", "*", "sort"), get("home_support_services", "*", "sort"),
            get("home_contact"), get("public_nav", "*", "sort"),
            get("public_footer_groups", "id,title,sort,links.*", "sort"),
          ]);

        document.title = site.site_title || "LinkAll 凌茂电子";
        const metaEl = document.querySelector('meta[name="description"]');
        if (metaEl) metaEl.setAttribute("content", site.meta_description || "");

        const logoImg = site.logo ? `<img src="${asset(site.logo)}" alt="${esc(site.company_name)}" />` : `<b style="font-size:22px;color:var(--blue)">LinkAll</b>`;

        const baseOf = (href) => String(href).split("#")[0].split("/").pop();
        const curRaw = location.pathname.split("/").pop();
        const cur = curRaw || "index.html";
        const isHome = (cur === "homepage-render.html" || cur === "index.html");
        const navHtml = nav.map(a => {
          const b = baseOf(a.href);
          const active = b && !String(a.href).includes("#") && (b === cur || (b === "homepage-render.html" && isHome));
          return `<a href="${esc(a.href)}" class="${active ? "active" : ""}">${esc(a.label)}</a>`;
        }).join("");

        const heroMetaHtml = heroMeta.map(m =>
          `<div><b>${esc(m.title)}</b><span>${esc(m.description)}</span></div>`).join("");

        const focusHtml = focus.map(c =>
          `<a class="focus-card" href="${esc(c.href)}"><b>${esc(c.index_label)}</b><h3>${esc(c.title)}</h3><p>${esc(c.description)}</p><span class="tiny-arrow">↗</span></a>`).join("");

        const solutionHtml = solutions.map(c =>
          `<a class="solution-card" href="${esc(c.href)}"><span class="solution-icon">${esc(c.index_number)}</span><div><h3>${esc(c.title)}</h3><p>${esc(c.description)}</p></div><span class="tiny-arrow">↗</span></a>`).join("");

        const appHtml = apps.map(a =>
          `<a class="application-item" href="${esc(a.href)}"><b>${esc(a.index_number)}</b><span>${esc(a.name)}</span><small>${esc(a.description)}</small></a>`).join("");

        const caseHtml = cases.map(c => {
          const cls = c.variant === "photo" ? "case-card photo" : "case-card data";
          const photoStyle = (c.variant === "photo" && c.image)
            ? `style="--photo:url('${asset(c.image)}')"` : "";
          const result = c.result_metric
            ? `<span><b>${esc(c.result_metric)}</b><br />${esc(c.result_metric_label)}</span>`
            : `<span>${esc(c.result_text)}</span>`;
          return `<a class="${cls}" ${photoStyle} href="${esc(c.href)}"><span class="case-kicker">${esc(c.kicker)}</span><div class="case-copy"><h3>${esc(c.title)}</h3><p>${esc(c.description)}</p><div class="case-result">${result}<span class="tiny-arrow">↗</span></div></div></a>`;
        }).join("");

        const supportHtml = support.map(s =>
          `<article class="support-card"><b>${esc(s.index_label)}</b><h3>${esc(s.title)}</h3><p>${esc(s.description)}</p></article>`).join("");

        const footerGroupsHtml = groups.map(g =>
          `<div class="footer-group"><b>${esc(g.title)}</b>${(g.links || []).map(l =>
            `<a href="${esc(l.href)}">${esc(l.label)}</a>`).join("")}</div>`).join("");

        document.getElementById("app").innerHTML = `
          <div class="topline"><div class="wrap">
            <span>${esc(site.company_name)} <strong>${esc(site.topline_tagline)}</strong></span>
            <div class="right"><span>咨询电话：<a class="topline-tel" href="${phoneTel(site)}">${esc(site.contact_phone_display)}</a></span><span>${esc(site.topline_lang_label)}</span></div>
          </div></div>

          <header><nav class="nav wrap" aria-label="主导航">
            <a class="brand" href="#top" aria-label="${esc(site.company_name)}首页">${logoImg}</a>
            <div class="nav-links">${navHtml}</div>
            <a class="cta" href="${phoneTel(site)}">${esc(contact.cta_label)} <span>↗</span></a>
          </nav></header>

          <main id="top">
            <section class="hero" aria-labelledby="hero-title"><div class="wrap">
              <div class="hero-copy">
                <span class="eyebrow">${esc(hero.eyebrow)}</span>
                <h1 id="hero-title">${esc(hero.title_main)}<br /><em>${esc(hero.title_highlight)}</em></h1>
                <p>${esc(hero.subtitle)}</p>
                <div class="hero-actions"><a class="cta" href="${esc(hero.cta_primary_href)}">${esc(hero.cta_primary_label)} <span>↗</span></a><a class="ghost" href="${esc(hero.cta_secondary_href)}">${esc(hero.cta_secondary_label)}</a></div>
                <div class="hero-meta" aria-label="服务能力摘要">${heroMetaHtml}</div>
              </div>
              <div class="signal-stage" aria-label="测试系统概念示意">
                <span class="stage-label">${esc(hero.stage_label)}</span><span class="stage-mark">${esc(hero.stage_mark)}</span>
                <div class="orbit"></div><div class="beam"></div>
                <div class="machine"><span class="machine-status">${br(hero.machine_status)}</span><span class="machine-name">${esc(hero.machine_name)}</span></div>
                <div class="node one"><b>${esc(hero.node1_label)}</b><span>${esc(hero.node1_desc)}</span></div><div class="node two"><b>${esc(hero.node2_label)}</b><span>${esc(hero.node2_desc)}</span></div>
              </div>
            </div></section>

            <section class="focus" aria-labelledby="focus-title"><div class="wrap"><div class="section-head"><div><span class="eyebrow">${esc(heads.focus_eyebrow)}</span><h2 id="focus-title">${esc(heads.focus_title)}</h2></div><p>${esc(heads.focus_subtitle)}</p></div><div class="focus-grid">${focusHtml}</div></div></section>

            <section class="solutions" id="solutions"><div class="wrap">
              <div class="section-head"><div><span class="eyebrow">${esc(heads.solutions_eyebrow)}</span><h2>${esc(heads.solutions_title)}</h2></div><p>${esc(heads.solutions_subtitle)}</p></div>
              <div class="solution-grid">${solutionHtml}</div>
            </div></section>

            <section class="applications" id="applications"><div class="wrap application-layout"><div class="application-copy"><span class="eyebrow">${esc(heads.applications_eyebrow)}</span><h2>${esc(heads.applications_title)}</h2><p>${esc(heads.applications_subtitle)}</p><a class="link-line" href="${esc(heads.applications_cta_href)}">${esc(heads.applications_cta_label)} <span class="tiny-arrow">↗</span></a></div><div class="application-list">${appHtml}</div></div></section>

            <section class="cases" id="cases"><div class="wrap"><div class="section-head"><div><span class="eyebrow">${esc(heads.cases_eyebrow)}</span><h2>${esc(heads.cases_title)}</h2></div><p>${esc(heads.cases_subtitle)}</p></div><div class="case-grid">${caseHtml}</div></div></section>

            <section class="support" id="support"><div class="wrap"><div class="section-head"><div><span class="eyebrow">${esc(heads.support_eyebrow)}</span><h2>${esc(heads.support_title)}</h2></div><p>${esc(heads.support_subtitle)}</p></div><div class="support-cards">${supportHtml}</div></div></section>

            <section class="contact" id="contact"><div class="wrap"><div><span class="eyebrow">${esc(contact.eyebrow)}</span><h2>${esc(contact.title_line1)}<br />${esc(contact.title_line2)}</h2></div><a class="cta" href="${phoneTel(site)}">${esc(contact.cta_label)} <span>↗</span></a></div></section>
          </main>

          <footer id="about"><div class="wrap"><div class="footer-top"><div class="footer-brand"><span class="footer-logo">${logoImg}</span><p>${br(site.footer_brand_text)}</p></div>${footerGroupsHtml}</div><div class="footer-bottom"><span>${esc(site.footer_copyright)}</span><span>${esc(site.footer_address)}</span></div></div></footer>
          ${consultWidget(site)}
        `;
        bindConsult();
      }
      main().catch(e => {
        document.getElementById("app").innerHTML =
          `<div class="wrap" style="padding:120px 0;color:#e72f36">加载失败：${esc(e.message)}<br/>请确认 Directus 实例可访问且已开启 Public 只读权限。</div>`;
        console.error(e);
      });
    </script>
  </body>
</html>
